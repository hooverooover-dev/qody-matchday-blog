*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;overflow-x:hidden}
h1,h2,h3{line-height:1.4;margin:0 0 .5em}
h2{font-size:1.2rem}
h3{font-size:1.05rem}
p{margin:0 0 .6em}
img{max-width:100%}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:3px solid var(--accent-d);outline-offset:2px;border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

/* Qody */
.qody{display:flex;align-items:center;gap:10px;padding:10px 14px 4px;max-width:760px;margin:0 auto}
.qody-img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--accent-soft);border:2px solid var(--accent-line);flex:none}
.bubble{position:relative;margin:0;padding:8px 12px;background:#fff;border:1.5px solid var(--accent-line);border-radius:16px;font-size:.95rem;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.bubble::before{content:"";position:absolute;left:-8px;top:18px;width:12px;height:12px;background:#fff;border-left:1.5px solid var(--accent-line);border-bottom:1.5px solid var(--accent-line);transform:rotate(45deg)}
.bubble:empty{display:none}

/* Layout */
.screen{max-width:760px;margin:0 auto;padding:8px 14px calc(var(--stepbar-h) + 28px + env(safe-area-inset-bottom));outline:none}
.steps{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);height:calc(var(--stepbar-h) + env(safe-area-inset-bottom))}
.steps button{flex:1 1 0;min-width:0;min-height:44px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 0;cursor:pointer;color:var(--muted)}
.steps .si{font-size:1.25rem;line-height:1}
.steps .sl{font-size:10px;line-height:1.2;white-space:nowrap;letter-spacing:-.02em}
.steps button[aria-current="step"]{color:var(--accent-d);background:var(--accent-soft);font-weight:700;border-radius:12px}
@media (min-width:900px){
  .steps{position:sticky;top:0;bottom:auto;height:auto;padding:6px 12px;border-top:0;border-bottom:1.5px solid var(--line);justify-content:center;gap:4px}
  .steps button{flex:0 1 auto;flex-direction:row;gap:6px;padding:8px 14px;border-radius:12px}
  .steps .sl{font-size:14px;letter-spacing:0}
  .steps .si{font-size:1.1rem}
  .screen{padding-bottom:40px}
  :root{--stepbar-h:0px}
}
.screen > h2{margin-top:10px}

/* Cards */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);margin:0 0 12px;overflow:hidden}
.card > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:10px 14px;font-weight:700}
.card > summary::-webkit-details-marker{display:none}
.card > summary::after{content:"▾";color:var(--muted);margin-left:4px;transition:transform .15s}
.card[open] > summary::after{transform:rotate(180deg)}
.card-body{padding:4px 14px 14px;border-top:1px dashed var(--line)}
.plain-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 12px}
.req{color:var(--coral);font-weight:700;margin-left:2px}
.badge{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;margin-left:auto}
.badge.ok{background:var(--accent-soft);color:var(--ok)}
.badge.todo{background:var(--coral-soft);color:#b23a28}
.badge.info{background:#f4ecdc;color:var(--muted)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}

/* Progress */
.progress{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:0 0 12px}
.pbar{height:12px;background:#f1e8d6;border-radius:999px;overflow:hidden}
.pbar > span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s}
.progress .ptext{display:flex;justify-content:space-between;gap:8px;margin:6px 0 0;font-size:.9rem;flex-wrap:wrap}
.unmet{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.unmet button{min-height:44px;border:1.5px solid var(--coral);background:var(--coral-soft);color:#8f2d1f;border-radius:999px;padding:4px 14px;cursor:pointer;font-size:.9rem}

/* Fields */
.field{margin:12px 0 0}
.field > label,.field > .lab{display:block;font-weight:700;font-size:.95rem;margin-bottom:4px}
input[type=text],input[type=date],input[type=time],input[type=search],input[type=number],select,textarea{
  width:100%;min-height:48px;padding:10px 12px;font-size:16px;border:1.5px solid #d9ccb5;border-radius:12px;background:#fffdf8;color:var(--ink)}
textarea{resize:vertical;line-height:1.6}
::placeholder{color:#a79b8c;opacity:1}
.hint{font-size:.82rem;color:var(--muted);margin:3px 0 0;line-height:1.5}
.warnhint{font-size:.85rem;color:#8a5a00;background:var(--amber-soft);border-radius:8px;padding:4px 10px;margin:4px 0 0;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .field{flex:1 1 140px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid #d9ccb5;background:#fffdf8;cursor:pointer;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ok);font-weight:700}
.chip.danger[aria-pressed="true"]{background:var(--coral-soft);border-color:var(--coral);color:#8f2d1f}
.check{display:flex;align-items:center;gap:10px;min-height:44px;margin:8px 0 0;cursor:pointer}
.check input{width:24px;height:24px;flex:none;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--ok);font-size:1.4rem;cursor:pointer;line-height:1}
.stepper output{min-width:48px;text-align:center;font-size:1.6rem;font-weight:700}
.stepper.off{opacity:.4;pointer-events:none}
.listitem{border:1.5px dashed var(--line);border-radius:14px;padding:4px 12px 12px;margin:12px 0 0;background:#fffcf5}
.listitem > .lihead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;margin-top:8px}
.linkrow{display:flex;gap:8px;align-items:center}
.linkrow select{flex:1;min-width:0}
.linkrow img,.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#f1e8d6;flex:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:8px 18px;border-radius:14px;border:1.5px solid var(--accent-d);background:var(--accent-d);color:#fff;font-weight:700;cursor:pointer;text-align:center;max-width:100%}
.btn.secondary{background:#fff;color:var(--ok)}
.btn.ghost{background:transparent;border-color:#d9ccb5;color:var(--ink);font-weight:500}
.btn.danger{background:#fff;border-color:var(--coral);color:#b23a28}
.btn.small{min-height:44px;padding:6px 12px;font-size:.9rem}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}

/* Lists */
.itemlist{list-style:none;margin:0;padding:0}
.itemlist li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.itemlist li:last-child{border-bottom:0}
.itemlist .meta{min-width:0;flex:1 1 180px}
.itemlist .meta b{display:block;overflow-wrap:anywhere}
.itemlist .meta span{font-size:.85rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.92rem;margin:4px 0}

/* Photos */
.pcard{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.pcard .big{width:96px;height:96px;border-radius:12px;object-fit:cover;background:#f1e8d6;display:block}
.pcard .noimg{width:96px;height:96px;border-radius:12px;background:#f1e8d6;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted);text-align:center;padding:4px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .chip{flex:1 1 120px}
.pnote{background:var(--amber-soft);border-radius:12px;padding:8px 12px;font-size:.88rem;margin:0 0 12px}

/* Titles */
.hooklist{list-style:none;margin:0;padding:0}
.hooklist li{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.hooklist .hk{font-weight:700;min-width:5.5em}
.hooklist .main{background:var(--accent);color:#fff;border-radius:999px;font-size:.75rem;padding:1px 8px;margin-left:6px;white-space:nowrap}
.titleopt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;margin:8px 0 0;cursor:pointer;min-height:48px;background:#fffdf8}
.titleopt input{width:22px;height:22px;margin-top:4px;flex:none;accent-color:var(--accent)}
.titleopt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.titleopt .tt{overflow-wrap:anywhere;flex:1;min-width:0}
.len{display:inline-block;font-size:.78rem;border-radius:999px;padding:0 8px;margin-left:6px;white-space:nowrap}
.len.ok{background:var(--accent-soft);color:var(--ok)}
.len.bad{background:var(--amber-soft);color:var(--amber)}

/* Article */
.atitle{font-size:1.25rem;font-weight:800;line-height:1.5;margin:6px 0 10px;overflow-wrap:anywhere}
.asec{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:0 0 12px}
.asec h3{font-size:1.08rem;border-bottom:2px solid var(--accent-line);padding-bottom:4px}
.asec p{margin:0 0 .7em;overflow-wrap:anywhere}
.asec ul{margin:0 0 .7em;padding-left:1.3em}
.asec hr{border:0;border-top:2px dashed var(--line);margin:10px 0}
.sent{display:inline;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;cursor:pointer;text-decoration:underline dotted var(--accent);text-underline-offset:4px;border-radius:4px}
.sent.open{background:var(--accent-soft)}
.sentbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:8px 10px;margin:0 0 .7em;font-size:.88rem}
.secactions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.editedtag{font-size:.78rem;background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:1px 8px}
.mdimg{display:block;margin:4px 0 .7em}
.mdimg img{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:12px;background:#f1e8d6}
.mdimg figcaption{font-size:.8rem;color:var(--muted)}
.mdimg.missing{background:#f1e8d6;border-radius:12px;padding:14px;color:var(--muted);font-size:.85rem}
.afoot{position:sticky;bottom:calc(var(--stepbar-h) + env(safe-area-inset-bottom));z-index:20;background:#fff;border:1.5px solid var(--accent-line);border-radius:16px;padding:8px 12px;margin:12px 0;box-shadow:0 -2px 10px rgba(80,60,20,.08)}
@media (min-width:900px){.afoot{bottom:8px}}
.afoot .l1{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.92rem;align-items:center}
.meter{position:relative;height:10px;background:#f1e8d6;border-radius:999px;margin:6px 0 2px;overflow:hidden}
.meter > span{display:block;height:100%;border-radius:999px;background:var(--accent)}
.meter.warn > span{background:#e0a52c}
.meter.bad > span{background:var(--coral)}
.meter i{position:absolute;top:0;bottom:0;width:2px;background:#8a7d6c;opacity:.55}
.qaitem{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.qaitem:last-child{border-bottom:0}
.qaitem .mk{flex:none;width:1.6em;text-align:center}
.qaitem .nm{font-weight:700;overflow-wrap:anywhere}
.qaitem .dt{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.suggest{background:var(--amber-soft);border-radius:var(--radius);padding:12px 14px;margin:0 0 12px}
.suggest button{display:block;width:100%;text-align:left;min-height:48px;margin-top:8px;padding:8px 12px;border:1.5px solid #e6c98c;background:#fff;border-radius:12px;cursor:pointer}
.suggest button b{display:block}
.suggest button span{font-size:.85rem;color:var(--muted)}

/* X, privacy, export */
.counter{font-size:.85rem;font-weight:700;color:var(--ok)}
.counter.over{color:#b23a28}
.xhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.xhead h3{margin:0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover}
table.ptable{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.88rem}
.ptable th,.ptable td{border-bottom:1px dashed var(--line);padding:6px 4px;text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:break-word}
.ptable th{font-size:.8rem;color:var(--muted)}
.ptable col.c1{width:64px}
.ptable col.c2{width:30%}
.altrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.altrow:last-child{border-bottom:0}
.altrow .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.exbtn{margin:0 0 12px}
.exbtn p{margin:4px 0 0;font-size:.85rem;color:var(--muted)}
.errbox{background:var(--coral-soft);border:1.5px solid var(--coral);border-radius:var(--radius);padding:14px;margin:0 0 12px}
.errbox code{display:block;margin-top:6px;font-size:.82rem;overflow-wrap:anywhere;white-space:pre-wrap;color:#6b2518}
.notebox{background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;margin:0 0 12px}
.greet h2{margin-bottom:.2em}

/* Toast and dialog */
.toast{position:fixed;left:50%;bottom:calc(var(--stepbar-h) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#3a3128;color:#fff;border-radius:999px;padding:10px 20px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;text-align:center;font-size:.92rem}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.toast{bottom:24px}}
.overlay{position:fixed;inset:0;background:rgba(58,49,40,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:20px;padding:18px;max-width:440px;width:100%;max-height:86vh;overflow:auto}
.modal h2{font-size:1.1rem}
.modal .btnrow{justify-content:flex-end}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}


</style>
</head>
<body>
<a class="skip" href="#screen">本文へスキップ</a>
<header id="qody" class="qody" hidden>
  <img id="qodyImg" class="qody-img" alt="コーディーくん" width="52" height="52">
  <p id="qodyText" class="bubble" aria-live="polite"></p>
</header>
<nav id="steps" class="steps" aria-label="すすむ場所">
  <button type="button" data-step="home"><span class="si" aria-hidden="true">🏠</span><span class="sl">ホーム</span></button>
  <button type="button" data-step="check" aria-label="チェックリスト"><span class="si" aria-hidden="true">📝</span><span class="sl">チェック</span></button>
  <button type="button" data-step="photos"><span class="si" aria-hidden="true">📷</span><span class="sl">写真</span></button>
  <button type="button" data-step="title"><span class="si" aria-hidden="true">🏷️</span><span class="sl">タイトル</span></button>
  <button type="button" data-step="article"><span class="si" aria-hidden="true">📰</span><span class="sl">記事</span></button>
  <button type="button" data-step="x" aria-label="X告知"><span class="si" aria-hidden="true">📣</span><span class="sl">X告知</span></button>
  <button type="button" data-step="privacy" aria-label="写真チェック"><span class="si" aria-hidden="true">🔒</span><span class="sl">写真確認</span></button>
  <button type="button" data-step="export" aria-label="書き出し"><span class="si" aria-hidden="true">📦</span><span class="sl">書き出し</span></button>
</nav>
<main id="screen" class="screen" tabindex="-1"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalHost"></div>
<input type="file" id="photoInput" accept="image/*" multiple hidden>
<input type="file" id="photoReplaceInput" accept="image/*" hidden>
<input type="file" id="restoreInput" accept="application/json,.json" hidden>

    // ------------------------------------------------------------ hooks

    // ------------------------------------------------------------ section builders

    // ------------------------------------------------------------ layout
    function joinPara(units) {

    // ------------------------------------------------------------ build
    function build(state, seriesLog) {
      var n = normalize(state);
      var hk = hooksOf(n, seriesLog);
      var seed = n.output.seed;
      var facts = buildFacts(n);
      var bs = baseSlots(n, hk.main);
      var base = { slots: bs.slots, raw: bs.raw, facts: baseSlotFacts(n) };
      var ctx = { seed: seed, counts: { attribution: 0, mascot: 0, catchphrase: 0 }, firstTimeStated: hk.main === "first_time", textSoFar: "", heads: [] };

      var secs = {};

      BUILD_ORDER.forEach(function (id) { secs[id] = builders[id](n, base, ctx); if (!secs[id].skipped) counted(secs[id], ctx); });
      // {sections}: plain label of the sections that have material

        return countBody(md);
      }
      var classes = [
        function (u) { return u.kind === "general" && u.sec.id !== "cta"; },
        function (u) { return /^(closer|outro|covers)$/.test(u.typeId); },
        function (u) { return u.kind === "mascot"; },

      };

        var sc = secs[id];

        var us = active(sc);
        us.forEach(function (u) {
          var k = firstInt(shifts[unitKey(u)]);
          if (!k || !u.cands || u.cands.length < 2) return;
          var len = u.cands.length, pos = ((u.pos + k) % len + len) % len;
          var otherEmoji = us.filter(function (x) { return x !== u && x.kind !== "fixed"; }).reduce(function (s, x) { return s + emojiCount(x.text); }, 0);
          var cap = id === "lead" ? 0 : (sc.rules.emoji_max_body != null ? sc.rules.emoji_max_body : 1);
          for (var tries = 0; tries < len; tries++) {

      function lid(key) {

      }
      function addLine(text, source) { var id = "F" + (ledger.length + 1); ledger.push({ id: id, text: text, source: source }); return id; }
      var edits = n.output.edits;
      var sections = [], counts = { attribution: 0, mascot: 0, catchphrase: 0, general: 0 };
      ARTICLE_ORDER.forEach(function (id) {
        var sc = secs[id], def = sc.def;
        var heading = def.heading || "";
        if (sc.skipped) { sections.push({ id: id, heading: heading, skipped: true, text: "", charCount: 0, edited: false, sentences: [] }); return; }
        var editText = typeof edits[id] === "string" && edits[id].trim() !== "" ? edits[id] : null;

              var ids = [];

      var hashtags = ["#WEリーグ", "#女子サッカー", hk.main === "player" && base.slots.player_tag ? base.slots.player_tag : "#" + base.slots.home.replace(/[\s・]/g, ""), "#現地観戦"];
      hashtags = uniq(hashtags.filter(function (h) { return h.length > 1; }));
      var live = sections.filter(function (s) { return !s.skipped; });

          title: title, main_hook: hk.main, sub_hooks: hk.subs.slice(), players: n.players.map(function (p) { return findPlayer(p.playerId).ja; }),

    function warningsOf(n) {

    // ------------------------------------------------------------ photos
    function altOf(p) { return p.caption || SCENE_ALT[p.scene] || "写真"; }
    function hookPhotoIds(n, hookType) {

        else if (!p.flags.length) rows.push({ photoId: p.id, flag: "なし", advice: p.publishOk === true ? "問題なし" : "公開してよいか、まだえらばれていません" });

        if (p.scene === "チケット・グッズ" && p.flags.indexOf("チケットのQR・名前") < 0) rows.push({ photoId: p.id, flag: "チケット・グッズの写真", advice: "QR・バーコード・名前が写っていないか、たしかめましょう" });
      });

    }

    // ------------------------------------------------------------ shortfall
    function shortfallOf(n) {

function updateProgress(fireEvents) {
  if (!ck.bar) return;
  var c = getChecklist();
  if (!c) return;
  var req = c.required || [], opt = c.optional || [];
  var okReq = req.filter(function (x) { return x.ok; }).length;
  var pct = req.length ? Math.round(okReq / req.length * 100) : 0;
  ck.bar.style.width = pct + '%';
  ck.barWrap.setAttribute('aria-valuenow', String(pct));
  ck.text.textContent = '必須 ' + okReq + ' / ' + req.length;
  ck.text2.textContent = c.canWrite ? '記事を書けます。「タイトル」へ進めます' : 'あと少しで書けます';
  clear(ck.unmet);
  req.filter(function (x) { return !x.ok; }).forEach(function (x) {
    ck.unmet.appendChild(h('li', null, h('button', { type: 'button', title: x.hint || '', onclick: function () { jumpToCard(cardOfKey(x.key)); } }, '★ ' + x.label + (x.hint ? '：' + x.hint : ''))));
  });
  var map = {};
  req.concat(opt).forEach(function (x) { map[x.key] = x; });
  CARDS.forEach(function (cd) {
    var b = document.getElementById('badge-' + cd.key);
    if (!b) return;
    var ok, has = true;
    if (cd.key === 'match') { ok = !!(map.match && map.match.ok) && !(map.score && !map.score.ok); }
    else if (cd.key === 'photos') { has = false; b.className = 'badge info'; b.textContent = st.photos.length + '枚'; return; }
    else if (cd.key === 'settings') { has = false; b.className = 'badge info'; b.textContent = ''; return; }
    else if (map[cd.key]) ok = map[cd.key].ok;
    else { b.textContent = ''; return; }
    b.className = 'badge ' + (ok ? 'ok' : (cd.req ? 'todo' : 'info'));
    b.textContent = ok ? '✓ OK' : (cd.req ? '未入力' : 'なくてもOK');
  });
  var pc = document.getElementById('photoCardCount');
  if (pc) pc.textContent = '今の写真：' + st.photos.length + '枚';
  var pi = document.getElementById('photoConfirmInfo');
  if (pi) { var un = st.photos.filter(function (p) { return p.publishOk !== true && p.publishOk !== false; }).length; pi.textContent = st.photos.length ? (un ? '公開OKが未選択の写真：' + un + '枚' : 'すべての写真で選択ずみです') : '写真がないときは、このままでOKです'; }

  var now = {};
  req.concat(opt).forEach(function (x) { now[x.key] = !!x.ok; });
  now.__can = !!c.canWrite;
  if (prevOk && fireEvents) {
    if (now.__can && !prevOk.__can) qodySay('ready_to_write');
    else {
      var keys = Object.keys(EVENT_FOR);
      for (var i = 0; i < keys.length; i++) if (now[keys[i]] && !prevOk[keys[i]]) { qodySay(EVENT_FOR[keys[i]]); break; }
    }
  }
  prevOk = now;
}

function nextPhotoId() {

function downscale(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var w = img.naturalWidth, hh = img.naturalHeight, max = 1280;
        var sc = Math.min(1, max / Math.max(w, hh));
        var cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(hh * sc));
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        var out = cv.toDataURL('image/jpeg', 0.85);
        URL.revokeObjectURL(url);
        resolve(out);
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('画像を読めませんでした')); };
    img.src = url;
  });
}
function addPhotos(files) {
  if (!st || !files || !files.length) return;
  var list = Array.prototype.slice.call(files);
  var failed = 0, added = 0;
  toast('写真を読み込み中…');
  var chain = Promise.resolve();
  list.forEach(function (f) {

  var y = window.scrollY;
  var open = $('#qapanel') && $('#qapanel').open;
  screenArticle.said = true;
  render({ keepScroll: true });
  if (open && $('#qapanel')) $('#qapanel').open = true;
  try { window.scrollTo(0, y); } catch (e) { /* ignore */ }
}

/* ============================================================
   X
   ============================================================ */
function xCard(o) {
  var wrap = h('div', { class: 'plain-card' });
  var cnt = h('span', { class: 'counter' });
  var tid = uid('x');
  var ta = h('textarea', { id: tid, rows: o.rows || 4, 'aria-label': o.title });
  ta.value = o.text;
  function paint() {
    var n = clen(ta.value);
    cnt.textContent = o.limit ? n + ' / ' + o.limit + '字' : n + '字';
    cnt.className = 'counter' + (o.limit && n > o.limit ? ' over' : '');
  }
  ta.addEventListener('input', function () { st.output.xEdits[o.key] = ta.value; paint(); touch(); resetBtn.hidden = false; });
  var resetBtn = h('button', { type: 'button', class: 'btn small danger', hidden: st.output.xEdits[o.key] == null, onclick: function () {
    delete st.output.xEdits[o.key]; saveNow(); ta.value = o.orig != null ? o.orig : o.text; resetBtn.hidden = true; paint(); toast('もとにもどしました');
  } }, 'もとにもどす');
  wrap.appendChild(h('div', { class: 'xhead' }, [h('h3', null, o.title), cnt]));
  if (o.note) wrap.appendChild(h('p', { class: 'hint' }, o.note));
  if (o.photoIds && o.photoIds.length) {
    var th = h('div', { class: 'thumbs', 'aria-label': 'いっしょにつける写真' });
    o.photoIds.forEach(function (pid) { th.appendChild(thumb(pid, '')); });
    wrap.appendChild(th);
  }
  wrap.appendChild(ta);
  wrap.appendChild(h('div', { class: 'btnrow' }, [
    h('button', { type: 'button', class: 'btn small', onclick: function () { doCopy(ta.value, o.title); } }, 'コピー'), resetBtn
  ]));
  paint();
  return wrap;
}
function screenX(root) {
  if (needWritable(root)) return;
  var c = compute();
  root.appendChild(h('h2', null, 'X告知'));
  if (c.err) { root.appendChild(errBox(c.err)); return; }
  var x = c.bundle.x || {};
  var xe = st.output.xEdits;
  // originals (without the user's edits) so that 「もとにもどす」 can restore them
  var o0 = guard('X告知の元の文', function () {
    var cs2 = Object.assign({}, c.cs, { output: Object.assign({}, c.cs.output, { xEdits: {} }) });
    return engine.build(cs2, seriesLog).x || {};
  });
  var x0 = o0.ok ? o0.v : x;
  if (x.teaser) root.appendChild(xCard({ title: '① 予告ポスト', key: 'teaser', text: x.teaser.text, orig: x0.teaser && x0.teaser.text, limit: 140, photoIds: x.teaser.photoIds, note: '記事を書いているあいだに、先に出します（リンクなし）' }));
  if (x.main) root.appendChild(xCard({ title: '② メインポスト', key: 'main', text: x.main.text, orig: x0.main && x0.main.text, limit: 140, photoIds: x.main.photoIds, note: '記事ができたら出します。URLは入れません' }));
  if (x.selfReply) root.appendChild(xCard({ title: '③ 自分への返信（リンク用）', key: 'selfReply', text: x.selfReply.text, orig: x0.selfReply && x0.selfReply.text, rows: 3, note: '[URL]をnoteの記事のURLにおきかえてください' }));
  (x.replies || []).slice(0, 3).forEach(function (t, i) {
    var k = 'reply' + i;
    var cur = xe[k] != null ? xe[k] : t;
    var orig = x0.replies && x0.replies[i] != null ? x0.replies[i] : t;
    root.appendChild(xCard({ title: '④ 返信テンプレ ' + (i + 1), key: k, text: cur, orig: orig, limit: 140, rows: 3 }));
  });
  root.appendChild(h('div', { class: 'btnrow' }, [h('button', { type: 'button', class: 'btn', onclick: function () { setStep('privacy'); } }, '写真チェックへ ▶')]));
}

/* ============================================================
   PRIVACY / VISUAL
   ============================================================ */
function screenPrivacy(root) {
  if (needWritable(root)) return;
  var c = compute();
  root.appendChild(h('h2', null, '写真チェック'));
  if (c.err) { root.appendChild(errBox(c.err)); return; }
  var v = c.bundle.visual || {};
  var hc = h('div', { class: 'plain-card' }, h('h3', null, 'ヘッダー写真'));
  if (v.header) {
    hc.appendChild(figure('ヘッダー写真', v.header.photoId));
    hc.appendChild(h('p', null, [h('b', null, '写真 ' + v.header.photoId + '：'), v.header.reason || '']));
  } else hc.appendChild(h('p', { class: 'empty' }, 'ヘッダーにできる写真がありません（公開OKで、チェックがついていない写真がある場合に選ばれます）。'));
  root.appendChild(hc);

  var ac = h('div', { class: 'plain-card' }, [h('h3', null, '代替テキスト（alt）'), h('p', { class: 'hint' }, 'noteの画像に説明を入れるときに使えます')]);
  if (!(v.alts || []).length) ac.appendChild(h('p', { class: 'empty' }, '使う写真がありません。'));
  (v.alts || []).forEach(function (a) {
    ac.appendChild(h('div', { class: 'altrow' }, [thumb(a.photoId), h('div', { class: 'txt' }, [h('b', null, a.photoId), '　', a.alt]),
      h('button', { type: 'button', class: 'btn small ghost', onclick: function () { doCopy(a.alt, 'altテキスト'); } }, 'コピー')]));
  });
  root.appendChild(ac);

  var pc = h('div', { class: 'plain-card' }, h('h3', null, 'プライバシーのチェック表'));
  var tbl = h('table', { class: 'ptable' }, [
    h('colgroup', null, [h('col', { class: 'c1' }), h('col', { class: 'c2' }), h('col')]),
    h('thead', null, h('tr', null, [h('th', null, '写真'), h('th', null, 'チェック'), h('th', null, 'どうする？')]))
  ]);
  var tb = h('tbody');
  (v.privacyRows || []).forEach(function (r) {
    tb.appendChild(h('tr', null, [h('td', null, [thumb(r.photoId), h('div', { class: 'hint' }, r.photoId)]), h('td', null, r.flag || ''), h('td', null, r.advice || '')]));
  });
  tbl.appendChild(tb);
  if (!(v.privacyRows || []).length) pc.appendChild(h('p', { class: 'empty' }, '写真がありません。')); else pc.appendChild(tbl);
  root.appendChild(pc);
  if ((v.notes || []).length) {
    var nb = h('div', { class: 'notebox' }, h('b', null, 'メモ'));
    var ul = h('ul'); v.notes.forEach(function (n) { ul.appendChild(h('li', null, n)); });
    nb.appendChild(ul); root.appendChild(nb);
  }
  root.appendChild(h('div', { class: 'btnrow' }, [h('button', { type: 'button', class: 'btn', onclick: function () { setStep('export'); } }, '書き出しへ ▶')]));
}

/* ============================================================
   EXPORT
   ============================================================ */
function confirmNg(qa) {
  if (!qa || !qa.ng) return Promise.resolve(true);
  if (ngAck === st.id + ':' + qa.ng) return Promise.resolve(true);
  return ask({
    title: 'QAに ❌ があります',
    message: '❌が ' + qa.ng + ' 件あります（' + qa.summary + '）。記事の画面で内容をたしかめてからがおすすめです。このまま進みますか？',
    buttons: [{ label: '記事にもどる', value: 'back' }, { label: 'このまま進む', value: true, primary: true }],
    cancelValue: false
  }).then(function (v) {
    if (v === true) { ngAck = st.id + ':' + qa.ng; return true; }
    if (v === 'back') setStep('article');
    return false;
  });
}
function fileBase() { return 'qody_' + (st.match.date || today()) + '_' + (st.match.home || 'home') + '-' + (st.match.away || 'away'); }
function screenExport(root) {
  if (needWritable(root)) return;
  var c = compute();
  root.appendChild(h('h2', null, '書き出し'));
  if (c.err) { root.appendChild(errBox(c.err)); return; }
  var b = c.bundle, qa = c.qa;
  root.appendChild(h('div', { class: 'notebox' }, [h('b', null, qa.summary || ''), h('div', null, num(b.bodyCharCount || 0) + '字')]));
  function exb(label, desc, fn, secondary) {
    var wrap = h('div', { class: 'exbtn' }, [
      h('button', { type: 'button', class: 'btn block' + (secondary ? ' secondary' : ''), onclick: function () {
        confirmNg(qa).then(function (ok) { if (!ok) return; var r = guard(label, fn); if (!r.ok) toast('うまくいきませんでした：' + (r.err.message || '')); else { qodySay('exported'); paintQody(); } });
      } }, label),
      h('p', null, desc)
    ]);
    root.appendChild(wrap);
  }
  var title = st.output.customTitle || b.title;
  exb('📋 noteに貼る本文をコピー', 'タイトルは別です。写真の場所は「（ここに写真 p1：…）」の目印になります。', function () { doCopy(QodyQA.noteText(b), '本文'); });
  exb('📋 タイトルをコピー', title, function () { doCopy(title, 'タイトル'); }, true);
  exb('⬇ まとめファイル（.md）をダウンロード', '記事・X告知・写真チェック・QAをひとつにまとめたファイルです。', function () {
    download(fileBase() + '.md', QodyQA.exportMarkdown(b, c.qa, c.cs), 'text/markdown');
  }, true);
  exb('⬇ 記事だけのページ（.html）をダウンロード', '公開OKの写真が入った、記事だけのページです。', function () {
    var urls = {};
    st.photos.forEach(function (p) { if (p.publishOk === true && photoData[p.id]) urls[p.id] = photoData[p.id]; });
    download(fileBase() + '.html', QodyQA.exportHtml(b, urls), 'text/html');
  }, true);

  var logged = seriesLog.some(function (e) { return b.seriesEntry && e.id === b.seriesEntry.id; });
  root.appendChild(h('div', { class: 'plain-card' }, [
    h('h3', null, 'この記事を記録する'),
    h('p', { class: 'hint' }, '記録すると、次の記事の切り口をえらぶときに「前と同じ切り口をさける」ために使われます。' + (logged ? '（この記事は記録ずみです。もう一度おすと上書きします）' : '')),
    h('button', { type: 'button', class: 'btn', onclick: function () {
      confirmNg(qa).then(function (ok) {
        if (!ok) return;
        var e = b.seriesEntry;
        if (!e) { toast('記録するデータがありません'); return; }
        var i = seriesLog.findIndex(function (x) { return x.id === e.id; });
        if (i >= 0) seriesLog[i] = e; else seriesLog.push(e);
        saveLog();
        qodySay('logged');
        toast('記録しました');
        render({ keepScroll: true });
      });
    } }, '📝 この記事を記録する')
  ]));
}

var SCREENS = { home: screenHome, check: screenCheck, photos: screenPhotos, title: screenTitle, article: screenArticle, x: screenX, privacy: screenPrivacy, 'export': screenExport };

/* ---------- boot ---------- */
function boot() {
  var r = guard('起動', function () {
    rebuildPlayers();
  });
  var root = $('#screen');
  if (!r.ok) { root.appendChild(errBox(r)); return; }
  try { window.localStorage.setItem('qody-we:probe', '1'); window.localStorage.removeItem('qody-we:probe'); } catch (e) { storageOK = false; }
  var d = lsGet(KEY_DRAFTS);
  if (d && typeof d === 'object' && !Array.isArray(d)) {
    Object.keys(d).forEach(function (k) { var x = d[k]; if (x && x.id === k) { try { var c = safeDraft(x); if (c) drafts[k] = c; } catch (e) { /* skip broken draft */ } } });
  }
  var lg = lsGet(KEY_LOG);
  if (Array.isArray(lg)) seriesLog = lg;
  paintQody();
  var nav = document.querySelectorAll('#steps button');
  for (var i = 0; i < nav.length; i++) {
    nav[i].addEventListener('click', function (ev) { setStep(ev.currentTarget.getAttribute('data-step')); });
  }
  $('#photoInput').addEventListener('change', function (ev) { addPhotos(ev.target.files); ev.target.value = ''; });
  $('#photoReplaceInput').addEventListener('change', function (ev) { var pid = ev.target.getAttribute('data-pid'); replacePhoto(pid, ev.target.files && ev.target.files[0]); ev.target.value = ''; });
  $('#restoreInput').addEventListener('change', function (ev) { onRestoreFile(ev.target.files && ev.target.files[0]); ev.target.value = ''; });
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveNow(); });
  window.addEventListener('error', function (ev) { try { console.error(ev.error || ev.message); } catch (e) { /* ignore */ } });
  openIdb().then(function (db) { idb = db; if (!db) idbOK = false; });
  render();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
